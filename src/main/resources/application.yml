server:
  servlet:
    context-path: /v1/api

spring:
  datasource:
    url: "${URL_JDBC:jdbc:postgresql://localhost:5432/juridicoDB}"
    username: "${USER_JDBC:postgres}"
    password: "${PASS_JDBC:admin}"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      enabled: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    contexts: development

security:
  api:
    key: "${SECRET_TOKEN:JURIDICO_TESTE}"
  jwt:
    secret: "${JWT_SECURITY:wF4mI7P+3S9URZdf93sXbB3dM08U91H06uZmwGBCh8rhjz5kH0BzD4KK2y2/YEX0Y6yfiQQ51lYDxYsA2gHZ0A==}"
    expirationMs: 360000

credential:
  google: "${GOOGLE_CREDENTIALS_JSON:}"

scheduler:
  deactivate-time: 3600000

openai:
  api:
    key: "${OPENAI_API_KEY:}"

driver:
  folders: "${ID_FOLDER_DRIVER:}"